<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>{{TITLE}}</title>
<meta name="theme-color" content="#008080">

<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
  /* Chrome subset — mirrored from index.html / 404.html. */
  :root {
    --face:     #c0c0c0;
    --face-lt:  #dfdfdf;
    --hi:       #ffffff;
    --sh:       #808080;
    --sh-dk:    #404040;
    --text:     #000000;
    --link:     #0000ee;
    --vlink:    #551a8b;
    --select:   #000080;
    --select-fg:#ffffff;
    --title-active: #000080;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #008080;
    font-family: "MS Sans Serif", "Geneva", "Tahoma", sans-serif;
    font-size: 11px; color: var(--text);
  }
  body { overflow-y: auto; overflow-x: hidden; }

  .window {
    width: 800px; max-width: 800px;
    height: calc(100vh - 24px); max-height: 720px;
    margin: 12px auto;
    background: var(--face);
    border: 2px solid;
    border-color: var(--hi) var(--sh-dk) var(--sh-dk) var(--hi);
    display: flex; flex-direction: column;
    box-shadow: 1px 1px 0 var(--sh-dk);
  }
  @media (min-height: 900px) { .window { max-height: 820px; } }
  @media (max-width: 820px) {
    .window {
      width: auto; max-width: none;
      height: calc(100vh - 12px); max-height: none; margin: 6px;
    }
    .toolbar { flex-wrap: wrap; }
    .tbtn { min-width: 44px; padding: 2px 3px; }
    .tbtn .lbl { font-size: 9px; }
    .titlebar .title { font-size: 10px; }
    .statusbar { font-size: 10px; }
  }
  @media (pointer: coarse) { .menu-item { padding: 4px 10px; } }

  .titlebar {
    height: 20px; background: var(--title-active); color: white;
    display: flex; align-items: center;
    padding: 0 2px 0 4px;
    font-weight: bold; font-size: 11px; user-select: none;
    flex-shrink: 0;
  }
  .titlebar .title { flex: 1; }
  .titlebar-btns { display: flex; gap: 2px; }
  .titlebar-btn {
    width: 16px; height: 14px;
    background: var(--face);
    border: 1px solid; border-color: var(--hi) var(--sh-dk) var(--sh-dk) var(--hi);
    color: black; font-size: 9px; font-weight: bold;
    line-height: 10px; text-align: center; cursor: default;
    font-family: "Marlett", "MS Sans Serif", sans-serif; padding: 0;
  }
  .titlebar-btn:active { border-color: var(--sh-dk) var(--hi) var(--hi) var(--sh-dk); }

  .menubar {
    display: flex; background: var(--face);
    border-bottom: 1px solid var(--sh);
    padding: 2px; flex-shrink: 0;
  }
  .menu-item { padding: 2px 8px; cursor: default; user-select: none; }
  .menu-item:hover { background: var(--select); color: var(--select-fg); }
  .menu-item .acc { text-decoration: underline; }

  .toolbar {
    display: flex; align-items: stretch; gap: 1px;
    padding: 3px; background: var(--face);
    border-bottom: 1px solid var(--sh);
    flex-shrink: 0; flex-wrap: wrap;
  }
  .tbtn {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-width: 48px; padding: 3px 5px 2px;
    background: var(--face);
    border: 2px solid transparent;
    cursor: default; user-select: none;
    font-size: 10px; color: black; line-height: 1;
  }
  .tbtn:hover { border-color: var(--hi) var(--sh-dk) var(--sh-dk) var(--hi); }
  .tbtn:active { border-color: var(--sh-dk) var(--hi) var(--hi) var(--sh-dk); background: var(--face-lt); }
  .tbtn .icon { width: 24px; height: 24px; margin-bottom: 2px;
    display: flex; align-items: center; justify-content: center; }
  .tbtn .lbl { font-size: 10px; }
  .tb-sep { width: 1px; margin: 2px 3px; background: var(--sh); border-right: 1px solid var(--hi); }
  /* Static info pages aren't editable — toolbar reads disabled. AI
     Composer stays active and opens the dialog on home. */
  .tbtn:not(.ai-btn) {
    opacity: 0.4;
    pointer-events: none;
  }

  .tbtn.ai-btn {
    background:
      linear-gradient(180deg,
        #ff44ff 0%, #ff00cc 32%, #cc00ff 50%, #00ccff 68%, #22ffff 100%);
    color: black;
    border: 2px solid;
    border-color: #ffff00 #ff00ff #ff00ff #ffff00;
    transform-origin: center;
    animation: ai-breathe 2.4s ease-in-out infinite;
    cursor: pointer;
  }
  .tbtn.ai-btn .lbl {
    font-weight: bold; letter-spacing: 0.02em;
    text-shadow: 1px 1px 0 #fff, 0 0 6px rgba(255,255,255,0.55);
  }
  .tbtn.ai-btn:hover {
    border-color: #ffff00 #00ffff #00ffff #ffff00;
    animation-play-state: paused;
  }
  @keyframes ai-breathe {
    0%   { transform: scale(1.00); box-shadow: 0 0 2px 0 rgba(255,0,255,.30), 0 0 5px 1px rgba(0,255,255,.45); }
    50%  { transform: scale(1.04); box-shadow: 0 0 10px 3px rgba(255,0,255,.55), 0 0 16px 5px rgba(0,255,255,.75); }
    100% { transform: scale(1.00); box-shadow: 0 0 2px 0 rgba(255,0,255,.30), 0 0 5px 1px rgba(0,255,255,.45); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tbtn.ai-btn { animation: none; transform: none;
      box-shadow: 0 0 10px 3px rgba(0,255,255,.85), 0 0 4px 1px rgba(255,0,255,.5); }
  }

  /* Workspace + content area */
  .workspace { flex: 1; background: var(--face); padding: 2px;
    overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .edit-frame { flex: 1; background: white;
    border: 2px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh);
    overflow: auto; min-height: 0; }

  /* Rendered Markdown — period-correct typography. */
  .doc-content {
    padding: 28px 36px 56px;
    font-family: "Times New Roman", Times, serif;
    font-size: 14pt;
    color: #000;
    background: white;
    line-height: 1.55;
    max-width: 100%;
  }
  .doc-content h1 {
    font-size: 2.2em; font-weight: bold;
    color: #cc0000;
    margin: 0 0 0.5em;
    line-height: 1.1;
    border-bottom: 2px solid #888;
    padding-bottom: 0.2em;
  }
  .doc-content h2 {
    font-size: 1.5em; font-weight: bold;
    color: #000080;
    margin: 1.6em 0 0.5em;
    line-height: 1.2;
  }
  .doc-content h3 {
    font-size: 1.15em; font-weight: bold;
    color: #800080;
    margin: 1.2em 0 0.4em;
  }
  .doc-content h4 { font-size: 1em; font-weight: bold; margin: 1.1em 0 0.4em; }
  .doc-content p  { margin: 0.7em 0; }
  .doc-content ul, .doc-content ol { margin: 0.6em 0 0.9em; padding-left: 32px; }
  .doc-content li { margin: 0.3em 0; }
  .doc-content li > p { margin: 0.2em 0; }
  .doc-content a  { color: #0000cc; text-decoration: underline; }
  .doc-content a:visited { color: #551a8b; }
  .doc-content strong { font-weight: bold; }
  .doc-content em { font-style: italic; }
  .doc-content hr { border: 0; border-top: 1px solid #888; border-bottom: 1px solid #fff; margin: 2em 0; }
  .doc-content blockquote {
    margin: 1em 0; padding: 0.5em 1em;
    border-left: 4px solid #888; background: #f5f5f5;
    font-style: italic;
  }
  .doc-content code {
    font-family: "Courier New", monospace;
    background: #f0f0f0; padding: 1px 5px;
    border: 1px solid #ddd; font-size: 0.9em;
  }
  .doc-content pre {
    background: #f0f0f0; border: 1px solid #ddd;
    padding: 10px 14px; overflow-x: auto;
    font-family: "Courier New", monospace; font-size: 0.85em;
  }
  .doc-content pre code { background: transparent; border: 0; padding: 0; }
  .doc-content table { border-collapse: collapse; margin: 1em 0; }
  .doc-content th, .doc-content td { border: 1px solid #888; padding: 6px 10px; }
  .doc-content th { background: #f0f0f0; font-weight: bold; }

  /* Status bar */
  .statusbar {
    height: 20px; background: var(--face);
    border-top: 1px solid var(--hi);
    display: flex; align-items: center;
    padding: 0 2px; font-size: 11px;
    flex-shrink: 0; gap: 2px;
  }
  .status-pane {
    border: 1px solid; border-color: var(--sh) var(--hi) var(--hi) var(--sh);
    padding: 1px 6px; height: 16px;
    display: flex; align-items: center;
  }
  .status-pane.flex { flex: 1; }
  .status-modem {
    background: var(--face); border: 1px solid;
    border-color: var(--sh) var(--hi) var(--hi) var(--sh);
    cursor: default; user-select: none;
    font-family: "MS Sans Serif", sans-serif; font-size: 11px;
    color: var(--text); padding: 1px 6px; height: 16px; white-space: nowrap;
  }

  /* Persistent footer-link cluster (Terms · Privacy · Copyright · FAQ) */
  .status-links {
    font-family: "MS Sans Serif", "Geneva", "Tahoma", sans-serif;
    font-size: 10px; white-space: nowrap;
  }
  .status-links a {
    color: var(--select); text-decoration: underline;
  }
  .status-links a:visited { color: var(--vlink); }
  .status-links .sep { color: #666; margin: 0 4px; }
  @media (max-width: 560px) {
    .status-links { display: none; }
  }
</style>
</head>
<body>

<div class="window">
  <div class="titlebar">
    <a class="title" href="/" style="color:inherit;text-decoration:none;">AI Netscape: 1997's AI-Powered HTML Editor</a>
    <div class="titlebar-btns">
      <button class="titlebar-btn" title="Minimize">_</button>
      <button class="titlebar-btn" title="Maximize">▢</button>
      <button class="titlebar-btn" title="Close" onclick="window.location.href='/'">✕</button>
    </div>
  </div>

  <!-- Menu bar (visual chrome only on content pages) -->
  <div class="menubar">
    <div class="menu-item"><span class="acc">F</span>ile</div>
    <div class="menu-item"><span class="acc">E</span>dit</div>
    <div class="menu-item"><span class="acc">V</span>iew</div>
    <div class="menu-item"><span class="acc">I</span>nsert</div>
    <div class="menu-item">F<span class="acc">o</span>rmat</div>
    <div class="menu-item"><span class="acc">T</span>ools</div>
    <div class="menu-item"><span class="acc">H</span>elp</div>
    <a class="menu-item" href="/gallery" style="text-decoration:none;color:inherit;"><span class="acc">G</span>allery</a>
  </div>

  <!-- Toolbar (visual; AI Composer button links to home) -->
  <div class="toolbar">
    <div class="tbtn"><div class="icon"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M4 2 h10 l4 4 v14 h-14 z" fill="white" stroke="black"/><path d="M14 2 v4 h4" fill="none" stroke="black"/></svg></div><div class="lbl">New</div></div>
    <div class="tbtn"><div class="icon"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M2 6 h7 l2 2 h9 v10 h-18 z" fill="#ffcc66" stroke="black"/><path d="M2 6 h7 l2 2 h9" fill="none" stroke="black"/></svg></div><div class="lbl">Open</div></div>
    <div class="tbtn"><div class="icon"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="3" y="3" width="16" height="16" fill="#4060a0" stroke="black"/><rect x="6" y="3" width="10" height="6" fill="white" stroke="black"/><rect x="7" y="12" width="8" height="7" fill="#dfdfdf" stroke="black"/><rect x="13" y="4" width="2" height="4" fill="black"/></svg></div><div class="lbl">Save</div></div>
    <div class="tbtn"><div class="icon"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="#4080d0" stroke="black"/><path d="M3 11 h16 M11 3 a 10 8 0 0 1 0 16 a 10 8 0 0 1 0 -16 M11 3 v16" fill="none" stroke="white" stroke-width="0.8"/></svg></div><div class="lbl">Publish</div></div>
    <div class="tb-sep"></div>
    <div class="tbtn"><div class="icon"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="2" y="3" width="18" height="13" fill="#dfdfdf" stroke="black"/><rect x="3" y="4" width="16" height="11" fill="white"/><path d="M8 18 h6 M11 16 v2" stroke="black"/><path d="M6 7 h10 M6 9 h10 M6 11 h6" stroke="#888"/></svg></div><div class="lbl">Preview</div></div>
    <div class="tbtn"><div class="icon"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="2" y="3" width="18" height="16" fill="white" stroke="black"/><text x="11" y="14" text-anchor="middle" font-family="Courier" font-size="9" fill="black">&lt;/&gt;</text></svg></div><div class="lbl">Source</div></div>
    <div class="tb-sep"></div>
    <div class="tbtn"><div class="icon"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M5 11 a4 4 0 0 1 4 -4 h2 M17 11 a4 4 0 0 1 -4 4 h-2" fill="none" stroke="black" stroke-width="2"/><path d="M8 11 h6" stroke="black" stroke-width="2"/></svg></div><div class="lbl">Link</div></div>
    <div class="tbtn"><div class="icon"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="6" r="2" fill="none" stroke="black" stroke-width="1.5"/><path d="M11 8 v10 M7 18 h8 M5 14 a6 4 0 0 0 12 0" fill="none" stroke="black" stroke-width="1.5"/></svg></div><div class="lbl">Anchor</div></div>
    <div class="tbtn"><div class="icon"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="2" y="3" width="18" height="16" fill="white" stroke="black"/><circle cx="7" cy="8" r="2" fill="#ffcc00"/><path d="M2 16 l5 -5 l4 4 l3 -3 l6 6 z" fill="#66aa44"/></svg></div><div class="lbl">Image</div></div>
    <div class="tbtn"><div class="icon"><svg width="22" height="22" viewBox="0 0 22 22"><line x1="2" y1="11" x2="20" y2="11" stroke="black" stroke-width="2"/></svg></div><div class="lbl">H. Line</div></div>
    <div class="tbtn"><div class="icon"><svg width="22" height="22" viewBox="0 0 22 22"><rect x="2" y="4" width="18" height="14" fill="white" stroke="black"/><line x1="2" y1="9" x2="20" y2="9" stroke="black"/><line x1="2" y1="13.5" x2="20" y2="13.5" stroke="black"/><line x1="8" y1="4" x2="8" y2="18" stroke="black"/><line x1="14" y1="4" x2="14" y2="18" stroke="black"/></svg></div><div class="lbl">Table</div></div>
    <div class="tb-sep"></div>
    <div class="tbtn"><div class="icon"><svg width="22" height="22" viewBox="0 0 22 22"><text x="2" y="14" font-family="Times" font-size="11" font-weight="bold" fill="black">ABC</text><path d="M2 16 q3 -2 6 0 t6 0" stroke="red" fill="none" stroke-width="1"/></svg></div><div class="lbl">Spelling</div></div>
    <div class="tb-sep"></div>
    <a href="/?ai=1" style="text-decoration:none;color:inherit;display:flex;">
      <div class="tbtn ai-btn" title="Open AI Composer">
        <div class="icon">
          <svg width="22" height="22" viewBox="0 0 22 22">
            <path d="M11 2 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" fill="white" stroke="black" stroke-width="0.8"/>
            <circle cx="17" cy="5" r="1.5" fill="white" stroke="black" stroke-width="0.6"/>
            <circle cx="4" cy="18" r="1" fill="white" stroke="black" stroke-width="0.6"/>
          </svg>
        </div>
        <div class="lbl">AI Composer</div>
      </div>
    </a>
  </div>

  <!-- Rendered Markdown content -->
  <div class="workspace">
    <div class="edit-frame">
      <div class="doc-content">
        {{CONTENT}}
      </div>
    </div>
  </div>

  <div class="statusbar">
    <div class="status-pane flex">Document: Done</div>
    <div class="status-pane status-links">
      <a href="/gallery">Top Sites</a><span class="sep">·</span><a href="/terms">Terms</a><span class="sep">·</span><a href="/privacy">Privacy</a><span class="sep">·</span><a href="/copyright">Copyright</a><span class="sep">·</span><a href="/faq">FAQ</a>
    </div>
    <div class="status-modem" title="Connection speed"><span>28.8 kbps</span></div>
    <div class="status-pane" id="status-clock">--:--</div>
  </div>
</div>

<script>
  function tickClock() {
    const d = new Date();
    document.getElementById('status-clock').textContent =
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  }
  setInterval(tickClock, 1000);
  tickClock();
</script>
</body>
</html>
