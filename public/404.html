<style>
  /* Chrome subset — mirrored from index.html so the 404 is visually
     indistinguishable from the home page. Kept inline for atomicity. */
  :root {
    --face:     #c0c0c0;
    --face-lt:  #dfdfdf;
    --hi:       #ffffff;
    --sh:       #808080;
    --sh-dk:    #404040;
    --text:     #000000;
    --link:     #0000ee;
    --vlink:    #551a8b;
    --select:   #000080;
    --select-fg:#ffffff;
    --title-active:   #000080;
    --status:   #c0c0c0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #008080;
    font-family: "MS Sans Serif", "Geneva", "Tahoma", sans-serif;
    font-size: 11px;
    color: var(--text);
  }
  body {
    overflow-y: auto;
    overflow-x: hidden;
  }

  /* Window frame — 800px centered on teal desktop. */
  .window {
    width: 800px;
    max-width: 800px;
    height: calc(100vh - 24px);
    max-height: 720px;
    margin: 12px auto;
    background: var(--face);
    border: 2px solid;
    border-color: var(--hi) var(--sh-dk) var(--sh-dk) var(--hi);
    display: flex;
    flex-direction: column;
    box-shadow: 1px 1px 0 var(--sh-dk);
  }
  @media (min-height: 900px) { .window { max-height: 820px; } }
  @media (max-width: 820px) {
    .window {
      width: auto; max-width: none;
      height: calc(100vh - 12px);
      max-height: none; margin: 6px;
    }
    .toolbar { flex-wrap: wrap; }
    .tbtn { min-width: 44px; padding: 2px 3px; }
    .tbtn .lbl { font-size: 9px; }
    .titlebar .title { font-size: 10px; }
    .statusbar { font-size: 10px; }
  }
  @media (pointer: coarse) { .menu-item { padding: 4px 10px; } }

  /* Titlebar */
  .titlebar {
    height: 20px;
    background: var(--title-active);
    color: white;
    display: flex; align-items: center;
    padding: 0 2px 0 4px;
    font-weight: bold;
    font-size: 11px;
    user-select: none;
    flex-shrink: 0;
  }
  .titlebar .title { flex: 1; }
  .titlebar-btns { display: flex; gap: 2px; }
  .titlebar-btn {
    width: 16px; height: 14px;
    background: var(--face);
    border: 1px solid;
    border-color: var(--hi) var(--sh-dk) var(--sh-dk) var(--hi);
    color: black;
    font-size: 9px; font-weight: bold;
    line-height: 10px; text-align: center;
    cursor: default;
    font-family: "Marlett", "MS Sans Serif", sans-serif;
    padding: 0;
  }
  .titlebar-btn:active { border-color: var(--sh-dk) var(--hi) var(--hi) var(--sh-dk); }

  /* Menubar (visual only on the 404 page) */
  .menubar {
    display: flex;
    background: var(--face);
    border-bottom: 1px solid var(--sh);
    padding: 2px;
    flex-shrink: 0;
  }
  .menu-item { padding: 2px 8px; cursor: default; user-select: none; }
  .menu-item:hover { background: var(--select); color: var(--select-fg); }
  .menu-item .acc { text-decoration: underline; }

  /* Toolbar */
  .toolbar {
    display: flex;
    align-items: stretch;
    gap: 1px;
    padding: 3px;
    background: var(--face);
    border-bottom: 1px solid var(--sh);
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  .tbtn {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-width: 48px;
    padding: 3px 5px 2px;
    background: var(--face);
    border: 2px solid transparent;
    cursor: default;
    user-select: none;
    font-size: 10px; color: black; line-height: 1;
  }
  .tbtn:hover { border-color: var(--hi) var(--sh-dk) var(--sh-dk) var(--hi); }
  .tbtn:active { border-color: var(--sh-dk) var(--hi) var(--hi) var(--sh-dk); background: var(--face-lt); }
  .tbtn .icon { width: 24px; height: 24px; margin-bottom: 2px;
    display: flex; align-items: center; justify-content: center; }
  .tbtn .lbl { font-size: 10px; }
  .tb-sep { width: 1px; margin: 2px 3px; background: var(--sh); border-right: 1px solid var(--hi); }

  /* AI Composer button — same magenta/cyan + breathe animation as home.
     On the 404 page, clicking it navigates back to /?compose=<seed>. */
  .tbtn.ai-btn {
    background:
      linear-gradient(180deg,
        #ff44ff 0%, #ff00cc 32%, #cc00ff 50%, #00ccff 68%, #22ffff 100%);
    color: black;
    border: 2px solid;
    border-color: #ffff00 #ff00ff #ff00ff #ffff00;
    transform-origin: center;
    animation: ai-breathe 2.4s ease-in-out infinite;
    cursor: pointer;
  }
  .tbtn.ai-btn .lbl {
    font-weight: bold; letter-spacing: 0.02em;
    text-shadow: 1px 1px 0 #fff, 0 0 6px rgba(255,255,255,0.55);
  }
  .tbtn.ai-btn:hover {
    border-color: #ffff00 #00ffff #00ffff #ffff00;
    animation-play-state: paused;
  }
  @keyframes ai-breathe {
    0%   { transform: scale(1.00); box-shadow: 0 0 2px 0 rgba(255,0,255,.30), 0 0 5px 1px rgba(0,255,255,.45); }
    50%  { transform: scale(1.04); box-shadow: 0 0 10px 3px rgba(255,0,255,.55), 0 0 16px 5px rgba(0,255,255,.75); }
    100% { transform: scale(1.00); box-shadow: 0 0 2px 0 rgba(255,0,255,.30), 0 0 5px 1px rgba(0,255,255,.45); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tbtn.ai-btn {
      animation: none; transform: none;
      box-shadow: 0 0 10px 3px rgba(0,255,255,.85), 0 0 4px 1px rgba(255,0,255,.5);
    }
  }

  /* Workspace */
  .workspace {
    flex: 1;
    background: var(--face);
    padding: 2px;
    overflow: hidden;
    display: flex; flex-direction: column;
    min-height: 0;
  }
  .edit-frame {
    flex: 1;
    background: white;
    border: 2px solid;
    border-color: var(--sh) var(--hi) var(--hi) var(--sh);
    overflow: auto;
    min-height: 0;
  }

  /* 404 content — lives where the editor would be on the home page */
  .error-content {
    min-height: 100%;
    padding: 40px 24px;
    font-family: "Times New Roman", Times, serif;
    font-size: 14pt;
    color: #000;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: left;
  }
  .error-inner { max-width: 500px; width: 100%; }
  .error-inner h1 {
    font-size: 2.4em;
    font-weight: bold;
    margin: 0 0 24px;
    text-align: center;
    line-height: 1.1;
    font-family: "Times New Roman", Times, serif;
  }
  .error-inner h1 .red  { color: #cc0000; }
  .error-inner h1 .blue { color: #0000cc; }
  .error-inner p  { margin: 0.9em 0; line-height: 1.5; }
  .error-inner ul { margin: 0.9em 0; padding-left: 28px; }
  .error-inner li { margin: 0.35em 0; line-height: 1.4; }
  .error-inner b  { font-weight: bold; }
  .error-inner i  { font-style: italic; }
  .error-inner code {
    font-family: "Courier New", monospace;
    background: #f0f0f0;
    padding: 1px 5px;
    font-size: 0.9em;
    border: 1px solid #ddd;
  }
  .return-home {
    text-align: center;
    margin: 36px 0 0;
  }
  .return-home a {
    color: #0000cc;
    text-decoration: underline;
    font-size: 14pt;
  }
  .ai-recovery {
    text-align: center;
    margin: 24px 0 0;
  }
  .ai-recovery p { margin: 0.4em 0; }
  .composer-cta {
    display: inline-block;
    color: #0000cc;
    text-decoration: underline;
    font-size: 12pt;
    font-family: "Times New Roman", Times, serif;
  }
  .composer-cta:hover { color: #cc00cc; }

  /* Status bar */
  .statusbar {
    height: 20px;
    background: var(--face);
    border-top: 1px solid var(--hi);
    display: flex; align-items: center;
    padding: 0 2px;
    font-size: 11px;
    flex-shrink: 0;
    gap: 2px;
  }
  .status-pane {
    border: 1px solid;
    border-color: var(--sh) var(--hi) var(--hi) var(--sh);
    padding: 1px 6px;
    height: 16px;
    display: flex; align-items: center;
  }
  .status-pane.flex { flex: 1; }
  .status-modem {
    background: var(--face);
    border: 1px solid;
    border-color: var(--sh) var(--hi) var(--hi) var(--sh);
    cursor: default;
    user-select: none;
    font-family: "MS Sans Serif", sans-serif;
    font-size: 11px;
    color: var(--text);
    padding: 1px 6px;
    height: 16px;
    white-space: nowrap;
  }
  #modem-cta {
    color: var(--select);
    text-decoration: underline;
    margin-left: 4px;
  }
  .status-links {
    font-family: "MS Sans Serif", "Geneva", "Tahoma", sans-serif;
    font-size: 10px; white-space: nowrap;
  }
  .status-links a { color: var(--select); text-decoration: underline; }
  .status-links a:visited { color: var(--vlink); }
  .status-links .sep { color: #666; margin: 0 4px; }
  @media (max-width: 640px) {
    #status-tags { display: none; }
    #status-msg { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  }
  @media (max-width: 560px) {
    .status-links { display: none; }
  }
</style>
</head>

<!-- ============================================================
     Six 404 variants. One is picked at random per page load.
     Each ends in a "Return to home page" link plus an AI Composer
     recovery affordance keyed to the dead URL's slug.
     ============================================================ -->

<template id="v1">

  <p>If the problem persists, please contact your system administrator or dial 1-800-AINETSCAPE for support.</p>

<!-- Shared footer (return link + AI Composer recovery affordance) -->
<template id="footer">
  <div class="return-home">
    <a href="/">Return to home page</a>
  </div>
  <hr noshade size="1" style="margin: 40px auto; width: 60%; border: 0; border-top: 1px solid #888;">
  <div class="ai-recovery" id="ai-recovery">
    <p style="font-size: 13px;">Did you mean to build this page?</p>
    <p style="font-size: 11px; color: #555; font-style: italic; margin: 8px 0 16px;">
      Try our AI Composer&trade; &mdash; it can compose any page you can describe, even in 1997.
    </p>
    <a href="/" class="composer-cta" id="composer-cta">[ Compose this page now ]</a>
  </div>
</template>

<script>
  // ---- Variant rotation ----
  const variants = document.querySelectorAll('template[id^="v"]');
  const chosen = variants[Math.floor(Math.random() * variants.length)];
  const footer = document.getElementById('footer');
  const mount = document.getElementById('error-mount');
  mount.appendChild(chosen.content.cloneNode(true));
  mount.appendChild(footer.content.cloneNode(true));

  // ---- URL slug → AI Composer brief ----
  // /coffee-shop-vancouver  → "A web page about coffee shop vancouver."
  // /x                      → "" (too short — hide the recovery affordance)
  function urlSlugToBrief(pathname) {
    const slug = pathname.replace(/^\//, '').replace(/\/$/, '').split('/').pop() || '';
    let words = '';
    try { words = decodeURIComponent(slug).replace(/[-_]+/g, ' ').trim(); }
    catch (_) { words = slug.replace(/[-_]+/g, ' ').trim(); }
    if (!words || words.length < 3) return '';
    return 'A web page about ' + words + '.';
  }

  const brief = urlSlugToBrief(window.location.pathname);
  const recovery = document.getElementById('ai-recovery');
  const cta = document.getElementById('composer-cta');
  const aiBtn = document.getElementById('ai-recover-btn');

  if (brief) {
    const href = '/?compose=' + encodeURIComponent(brief);
    if (cta) cta.href = href;
    if (aiBtn) aiBtn.addEventListener('click', () => { window.location.href = href; });
  } else {
    // No usable slug — hide the recovery affordance entirely; the AI button
    // still works, just lands on the home page with no brief seed.
    if (recovery) recovery.style.display = 'none';
    if (aiBtn) aiBtn.addEventListener('click', () => { window.location.href = '/'; });
  }

  // ---- Status bar clock (decorative — matches home page behavior) ----
  function tickClock() {
    const d = new Date();
    document.getElementById('status-clock').textContent =
      String(d.getHours()).padStart(2,'0') + ':' +
      String(d.getMinutes()).padStart(2,'0');
  }
  setInterval(tickClock, 1000);
  tickClock();
</script>
</body>
</html>
